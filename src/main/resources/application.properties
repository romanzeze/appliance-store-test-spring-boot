spring.config.import=optional:file:.env[.properties]

spring.profiles.default=prod
server.port=8080

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders[adminEmail]=${ADMIN_EMAIL:}
spring.flyway.placeholders[adminPassword]=${ADMIN_INITIAL_PASSWORD:}

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

logging.level.com.epam.rd.autocode.assessment.appliances=DEBUG

spring.messages.basename=messages/messages
spring.messages.fallback-to-system-locale=false
app.contact.recipient=${CONTACT_RECIPIENT:}
app.contact.from=${CONTACT_FROM:no-reply@appliance.store}

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:30}
app.security.max-login-attempts=5
app.security.lockout-minutes=15
app.security.in-memory.email=${IN_MEMORY_ADMIN_EMAIL:}
app.security.in-memory.password=${IN_MEMORY_ADMIN_PASSWORD:}
