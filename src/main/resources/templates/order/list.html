<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{title.orders})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${deletedView} ? #{title.orders.deleted} : #{title.orders}"></h1>
        <div class="d-flex gap-2">
            <a th:if="${!deletedView}" class="btn btn-primary" th:href="@{/orders/new}" th:text="#{btn.new.order}"></a>
            <th:block sec:authorize="hasRole('EMPLOYEE')">
                <a th:if="${!deletedView}" sec:authorize="hasRole('ADMIN')" class="btn btn-outline-secondary" th:href="@{/orders/deleted}" th:text="#{btn.show.deleted}"></a>
                <a th:if="${deletedView}" class="btn btn-outline-secondary" th:href="@{/orders}" th:text="#{btn.show.active}"></a>
            </th:block>
        </div>
    </div>
    <div class="btn-group mb-3" sec:authorize="hasRole('EMPLOYEE')" th:if="${!deletedView}">
        <a class="btn btn-outline-secondary" th:classappend="${approved == null} ? 'active'" th:href="@{/orders}" th:text="#{filter.all}"></a>
        <a class="btn btn-outline-secondary" th:classappend="${approved != null and approved} ? 'active'" th:href="@{/orders(approved=true)}" th:text="#{status.approved}"></a>
        <a class="btn btn-outline-secondary" th:classappend="${approved != null and !approved} ? 'active'" th:href="@{/orders(approved=false)}" th:text="#{status.pending}"></a>
    </div>
    <p class="text-muted" th:if="${items.isEmpty()}" th:text="#{label.empty}"></p>
    <div class="table-responsive" th:unless="${items.isEmpty()}">
        <table class="table table-hover align-middle">
            <thead>
            <tr class="table-head">
                <th th:replace="~{fragments/layout :: sortable('id', #{label.id})}"></th>
                <th th:text="#{label.client}"></th>
                <th th:text="#{label.employee}"></th>
                <th th:replace="~{fragments/layout :: sortable('approved', #{label.status})}"></th>
                <th th:text="#{label.total}"></th>
                <th th:text="#{label.actions}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.clientName}"></td>
                <td th:text="${item.employeeName}"></td>
                <td>
                    <span class="badge text-bg-success" th:if="${item.approved}" th:text="#{status.approved}"></span>
                    <span class="badge text-bg-secondary" th:unless="${item.approved}" th:text="#{status.pending}"></span>
                </td>
                <td th:text="${#numbers.formatDecimal(item.totalAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                <td>
                    <div class="d-flex gap-1">
                        <a th:if="${!deletedView}" class="btn btn-sm btn-outline-primary" th:href="@{|/orders/${item.id}|}" th:text="#{btn.details}"></a>
                        <form th:if="${deletedView}" th:action="@{|/orders/${item.id}/restore|}" method="post">
                            <button class="btn btn-sm btn-outline-success" type="submit" th:text="#{btn.restore}"></button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav th:replace="~{fragments/layout :: pager}"></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
