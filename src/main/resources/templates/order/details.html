<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{title.order})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-3"><span th:text="#{title.order}"></span> #<span th:text="${order.id}"></span></h1>
    <dl class="row">
        <dt class="col-sm-3" th:text="#{label.client}"></dt><dd class="col-sm-9" th:text="${order.clientName}"></dd>
        <dt class="col-sm-3" th:text="#{label.employee}"></dt><dd class="col-sm-9" th:text="${order.employeeName}"></dd>
        <dt class="col-sm-3" th:text="#{label.status}"></dt>
        <dd class="col-sm-9">
            <span class="badge text-bg-success" th:if="${order.approved}" th:text="#{status.approved}"></span>
            <span class="badge text-bg-secondary" th:unless="${order.approved}" th:text="#{status.pending}"></span>
        </dd>
    </dl>
    <table class="table">
        <thead>
        <tr class="table-dark">
            <th th:text="#{label.appliance}"></th>
            <th th:text="#{label.quantity}"></th>
            <th th:text="#{label.amount}"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${order.rows}">
            <td th:text="${row.applianceName}"></td>
            <td th:text="${row.number}"></td>
            <td th:text="${#numbers.formatDecimal(row.amount, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="2" th:text="#{label.total}"></th>
            <th th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')}"></th>
        </tr>
        </tfoot>
    </table>
    <div class="d-flex gap-2 flex-wrap">
        <a class="btn btn-outline-secondary" th:href="@{/orders}" th:text="#{btn.back}"></a>
        <a th:if="${!order.approved}" class="btn btn-outline-primary" th:href="@{|/orders/${order.id}/edit|}" th:text="#{btn.edit}"></a>
        <form th:if="${!order.approved}" sec:authorize="hasRole('EMPLOYEE')"
              th:action="@{|/orders/${order.id}/approve|}" method="post">
            <button class="btn btn-success" type="submit" th:text="#{btn.approve}"></button>
        </form>
        <form th:action="@{|/orders/${order.id}/delete|}" method="post" th:attr="data-confirm=#{confirm.delete}">
            <button class="btn btn-outline-danger" type="submit" th:text="#{btn.delete}"></button>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
