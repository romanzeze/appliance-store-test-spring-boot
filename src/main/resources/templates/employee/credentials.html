<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{title.credentials})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 640px;">
    <h1 class="h3 mb-3" th:text="#{title.credentials}"></h1>
    <div class="alert alert-warning" th:text="#{credentials.once}"></div>
    <dl class="row">
        <dt class="col-sm-4" th:text="#{label.name}"></dt><dd class="col-sm-8" th:text="${account.name}"></dd>
        <dt class="col-sm-4" th:text="#{label.email}"></dt><dd class="col-sm-8" th:text="${account.email}"></dd>
        <dt class="col-sm-4" th:text="#{label.password.temporary}"></dt>
        <dd class="col-sm-8"><code class="fs-5" th:text="${temporaryPassword}"></code></dd>
    </dl>
    <p class="text-muted" th:text="#{credentials.validity}"></p>
    <a class="btn btn-primary" th:href="@{/employees}" th:text="#{btn.back}"></a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
