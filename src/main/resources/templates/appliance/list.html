<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{title.appliances})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h1 class="mb-0" th:text="${deletedView} ? #{title.appliances.deleted} : #{title.appliances}"></h1>
        <div class="d-flex gap-2" sec:authorize="hasRole('EMPLOYEE')">
            <a th:if="${!deletedView}" class="btn btn-primary" th:href="@{/appliances/add}" th:text="#{btn.add}"></a>
            <a th:if="${!deletedView}" sec:authorize="hasRole('ADMIN')" class="btn btn-outline-secondary" th:href="@{/appliances/deleted}" th:text="#{btn.show.deleted}"></a>
            <a th:if="${deletedView}" class="btn btn-outline-secondary" th:href="@{/appliances}" th:text="#{btn.show.active}"></a>
        </div>
    </div>
    <form th:if="${!deletedView}" th:action="@{/appliances}" method="get" class="filter-panel row g-3 mb-4">
        <div class="col-md-3"><input class="form-control" type="search" name="query" th:value="${filter.query}" th:placeholder="#{label.search}"/></div>
        <div class="col-md-2">
            <select class="form-select" name="category" data-auto-submit>
                <option value="" th:text="#{label.category}"></option>
                <option th:each="c : ${categories}" th:value="${c}" th:text="#{'enum.category.' + ${c}}" th:selected="${c == filter.category}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <select class="form-select" name="manufacturerId" data-auto-submit>
                <option value="" th:text="#{label.manufacturer}"></option>
                <option th:each="m : ${manufacturers}" th:value="${m.id}" th:text="${m.name}" th:selected="${m.id == filter.manufacturerId}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <select class="form-select" name="powerType" data-auto-submit>
                <option value="" th:text="#{label.powerType}"></option>
                <option th:each="p : ${powerTypes}" th:value="${p}" th:text="#{'enum.powerType.' + ${p}}" th:selected="${p == filter.powerType}"></option>
            </select>
        </div>
        <div class="col-auto d-flex align-items-center gap-2">
            <button class="btn btn-primary" type="submit" th:text="#{btn.search}"></button>
            <a class="btn btn-link" th:href="@{/appliances}" th:text="#{btn.reset}"></a>
        </div>
    </form>
    <div class="sort-bar d-flex justify-content-end align-items-center mb-3" th:unless="${items.isEmpty()}">
        <span class="text-muted small" th:text="#{label.sort}"></span>
        <a th:each="s : ${ {'name', 'category', 'power', 'price'} }"
           th:href="@{${path + '?sort=' + s + '&dir=' + (sort == s and dir == 'asc' ? 'desc' : 'asc') + '&size=' + size + filterQs}}"
           th:classappend="${sort == s} ? 'active'">
            <span th:text="#{'label.' + ${s}}"></span><span th:if="${sort == s}" th:text="${dir == 'asc'} ? ' ▲' : ' ▼'"></span>
        </a>
    </div>
    <p class="text-muted" th:if="${items.isEmpty()}" th:text="#{label.empty}"></p>
    <div class="row g-4" th:unless="${items.isEmpty()}">
        <div class="col-sm-6 col-lg-4 col-xl-3" th:each="item : ${items}">
            <article class="product-card">
                <div class="product-thumb">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 7h6M9 12h6"></path></svg>
                </div>
                <div class="product-body">
                    <span class="product-meta" th:text="#{'enum.category.' + ${item.category}} + ' · ' + #{'enum.powerType.' + ${item.powerType}}"></span>
                    <a class="product-name product-link" th:href="@{|/appliances/${item.id}|}" th:text="${item.displayName(#locale.language)}"></a>
                    <span class="product-meta" th:text="${item.manufacturerName} + ' · ' + ${item.model}"></span>
                    <span class="product-desc" th:text="${item.displayCharacteristic(#locale.language)}"></span>
                    <span class="product-meta" th:text="${item.power} + ' W'"></span>
                    <div class="product-footer">
                        <div class="product-price mb-2" th:text="${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}"></div>
                        <div class="d-flex flex-wrap gap-1">
                            <form th:if="${!deletedView}" sec:authorize="isAuthenticated()" th:action="@{/cart/add}" method="post">
                                <input type="hidden" name="applianceId" th:value="${item.id}"/>
                                <input type="hidden" name="next" th:value="${returnTo}"/>
                                <button class="btn btn-sm btn-primary" type="submit" th:text="#{btn.cart.add}"></button>
                            </form>
                            <a th:if="${!deletedView}" sec:authorize="!isAuthenticated()" class="btn btn-sm btn-primary" th:href="@{/login}" th:text="#{btn.cart.add}"></a>
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{|/appliances/${item.id}|}" th:text="#{btn.details}"></a>
                            <th:block sec:authorize="hasRole('EMPLOYEE')">
                                <th:block th:if="${!deletedView}">
                                    <a class="btn btn-sm btn-outline-primary" th:href="@{|/appliances/${item.id}/edit|}" th:text="#{btn.edit}"></a>
                                    <form th:action="@{|/appliances/${item.id}/delete|}" method="post" th:attr="data-confirm=#{confirm.delete}">
                                        <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{btn.delete}"></button>
                                    </form>
                                </th:block>
                                <form th:if="${deletedView}" th:action="@{|/appliances/${item.id}/restore|}" method="post">
                                    <button class="btn btn-sm btn-outline-primary" type="submit" th:text="#{btn.restore}"></button>
                                </form>
                            </th:block>
                        </div>
                    </div>
                </div>
            </article>
        </div>
    </div>
    <div class="mt-4"><nav th:replace="~{fragments/layout :: pager}"></nav></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
