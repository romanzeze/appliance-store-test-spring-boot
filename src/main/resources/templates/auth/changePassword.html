<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{title.password})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 560px;">
    <h1 class="h3 mb-3" th:text="#{title.password}"></h1>
    <div class="alert alert-warning" th:if="${forced}" th:text="#{password.forced}"></div>
    <form th:action="@{/password/change}" th:object="${passwordForm}" method="post" novalidate>
        <div th:replace="~{fragments/layout :: globalErrors}"></div>
        <div th:replace="~{fragments/layout :: password('currentPassword', #{label.password.current}, 'current-password', true)}"></div>
        <div th:replace="~{fragments/layout :: password('newPassword', #{label.password.new}, 'new-password', true)}"></div>
        <div th:replace="~{fragments/layout :: password('confirmPassword', #{label.password.confirm}, 'new-password', true)}"></div>
        <button class="btn btn-primary" type="submit" th:text="#{btn.save}"></button>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
