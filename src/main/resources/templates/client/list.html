<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{title.clients})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${deletedView} ? #{title.clients.deleted} : #{title.clients}"></h1>
        <div>
            <a th:if="${!deletedView}" class="btn btn-outline-secondary" th:href="@{/clients/deleted}" th:text="#{btn.show.deleted}"></a>
            <a th:if="${deletedView}" class="btn btn-outline-secondary" th:href="@{/clients}" th:text="#{btn.show.active}"></a>
        </div>
    </div>
    <form th:if="${!deletedView}" th:action="@{/clients}" method="get" class="row g-2 mb-3">
        <div class="col-auto"><input class="form-control" type="search" name="query" th:value="${query}" th:placeholder="#{label.search}"/></div>
        <div class="col-auto"><button class="btn btn-outline-primary" type="submit" th:text="#{btn.search}"></button></div>
    </form>
    <p class="text-muted" th:if="${items.isEmpty()}" th:text="#{label.empty}"></p>
    <div class="table-responsive" th:unless="${items.isEmpty()}">
        <table class="table table-hover align-middle">
            <thead>
            <tr class="table-dark">
                <th th:replace="~{fragments/layout :: sortable('id', #{label.id})}"></th>
                <th th:replace="~{fragments/layout :: sortable('name', #{label.name})}"></th>
                <th th:replace="~{fragments/layout :: sortable('email', #{label.email})}"></th>
                <th th:text="#{label.status}"></th>
                <th th:text="#{label.actions}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${item.email}"></td>
                <td>
                    <span class="badge text-bg-danger" th:if="${item.blocked}" th:text="#{status.blocked}"></span>
                    <span class="badge text-bg-success" th:unless="${item.blocked}" th:text="#{status.active}"></span>
                </td>
                <td>
                    <div class="d-flex gap-1 flex-wrap">
                        <th:block th:if="${!deletedView}">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{|/clients/${item.id}/edit|}" th:text="#{btn.edit}"></a>
                            <form th:if="${!item.blocked}" th:action="@{|/clients/${item.id}/block|}" method="post" th:attr="data-confirm=#{confirm.block}">
                                <button class="btn btn-sm btn-outline-warning" type="submit" th:text="#{btn.block}"></button>
                            </form>
                            <form th:if="${item.blocked}" th:action="@{|/clients/${item.id}/unblock|}" method="post">
                                <button class="btn btn-sm btn-outline-success" type="submit" th:text="#{btn.unblock}"></button>
                            </form>
                            <form th:action="@{|/clients/${item.id}/delete|}" method="post" th:attr="data-confirm=#{confirm.delete}">
                                <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{btn.delete}"></button>
                            </form>
                        </th:block>
                        <form th:if="${deletedView}" th:action="@{|/clients/${item.id}/restore|}" method="post">
                            <button class="btn btn-sm btn-outline-success" type="submit" th:text="#{btn.restore}"></button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav th:replace="~{fragments/layout :: pager}"></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
