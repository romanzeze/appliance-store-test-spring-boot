<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{title.contact})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 640px;">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-2" th:text="#{title.contact}"></h1>
    <p class="text-muted" th:text="#{contact.lead}"></p>
    <form th:action="@{/contact}" th:object="${contact}" method="post" novalidate>
        <div th:replace="~{fragments/layout :: globalErrors}"></div>
        <div th:replace="~{fragments/layout :: textField('name', #{label.name}, 'text', true)}"></div>
        <div th:replace="~{fragments/layout :: textField('email', #{label.email}, 'email', true)}"></div>
        <div class="mb-3">
            <label class="form-label" for="message"><span th:text="#{label.message}"></span><span class="required-mark" aria-hidden="true"> *</span></label>
            <textarea class="form-control" rows="6" th:field="*{message}" th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></div>
        </div>
        <button class="btn btn-primary" type="submit" th:text="#{btn.send}"></button>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
