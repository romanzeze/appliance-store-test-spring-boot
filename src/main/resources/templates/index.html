<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{shop.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 th:text="#{index.welcome}"></h1>
    <p class="lead" th:text="#{index.lead}"></p>
    <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
        <a class="btn btn-primary" th:href="@{/login}" th:text="#{btn.login}"></a>
        <a class="btn btn-outline-primary" th:href="@{/register}" th:text="#{btn.register}"></a>
    </div>
    <div sec:authorize="isAuthenticated()" class="d-flex gap-2">
        <a class="btn btn-primary" th:href="@{/appliances}" th:text="#{nav.appliances}"></a>
        <a class="btn btn-outline-primary" th:href="@{/orders}" th:text="#{nav.orders}"></a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
