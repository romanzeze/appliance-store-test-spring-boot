<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title th:text="#{'error.title.' + ${status}}">Error</title>
</head>
<body>
<main class="container py-5 text-center">
    <p class="display-1 text-muted" th:text="${status}"></p>
    <h1 th:text="#{'error.title.' + ${status}}"></h1>
    <p class="lead" th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : #{'error.message.' + ${status}}"></p>
    <a class="btn btn-primary" th:href="@{/}" th:text="#{error.back.home}"></a>
</main>
</body>
</html>
