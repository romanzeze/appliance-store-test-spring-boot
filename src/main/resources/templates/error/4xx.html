<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{'error.title.' + ${status}})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5">
    <div class="error-card mx-auto text-center">
        <p class="error-code mb-2" th:text="${status}"></p>
        <h1 class="mb-3" th:text="#{'error.title.' + ${status}}"></h1>
        <p class="text-muted fs-5 mb-4" th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : #{'error.message.' + ${status}}"></p>
        <div class="d-flex justify-content-center gap-2">
            <a class="btn btn-primary btn-lg px-4" th:href="@{/}" th:text="#{error.back.home}"></a>
            <a class="btn btn-outline-secondary btn-lg px-4" th:href="@{/appliances}" th:text="#{nav.appliances}"></a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
