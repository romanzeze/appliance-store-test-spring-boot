<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:wght@500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
    <title th:text="${title}">Appliance store</title>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-md site-nav">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}" th:text="#{shop.name}">Appliance store</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/appliances}" th:text="#{nav.appliances}"></a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/orders}" th:text="#{nav.orders}"></a></li>
                <li class="nav-item" sec:authorize="hasRole('EMPLOYEE')">
                    <a class="nav-link" th:href="@{/manufacturers}" th:text="#{nav.manufacturers}"></a></li>
                <li class="nav-item" sec:authorize="hasRole('EMPLOYEE')">
                    <a class="nav-link" th:href="@{/clients}" th:text="#{nav.clients}"></a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/employees}" th:text="#{nav.employees}"></a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/audit}" th:text="#{nav.audit}"></a></li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-md-center">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{${currentPath ?: '/'}(lang='en')}">EN</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{${currentPath ?: '/'}(lang='uk')}">UK</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/orders/new}"><span th:text="#{nav.cart}"></span> <span class="badge text-bg-success" th:text="${@cart.count()}"></span></a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated() and !hasAuthority('IN_MEMORY')">
                    <a class="nav-link" th:href="@{/account}" th:title="#{nav.account}" sec:authentication="principal.name"></a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('IN_MEMORY')">
                    <span class="nav-link" sec:authentication="principal.name"></span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-link nav-link" th:text="#{btn.logout}"></button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}" th:text="#{btn.login}"></a>
                </li>
                <li class="nav-item ms-md-2" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-primary" th:href="@{/register}" th:text="#{btn.register}"></a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="footer fixed-bottom text-center">
    <span th:text="#{footer.text}">Appliance store</span>
    <span class="mx-2">·</span>
    <a th:href="@{/contact}" th:text="#{footer.contact}"></a>
</footer>

<div th:fragment="flash">
    <div class="alert alert-success" th:if="${successKey != null}" th:text="${#messages.msg(successKey)}"></div>
</div>

<div th:fragment="globalErrors" class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
    <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
</div>

<div th:fragment="textField(field, label, type, required)" class="mb-3">
    <label class="form-label" th:for="${field}"><span th:text="${label}"></span><span class="required-mark" th:if="${required}" aria-hidden="true"> *</span></label>
    <input class="form-control" th:type="${type}" th:field="*{__${field}__}" th:errorclass="is-invalid"
           th:attr="inputmode=${field == 'card' ? 'numeric' : null},autocomplete=${field == 'card' ? 'cc-number' : null},data-card-mask=${field == 'card' ? 'true' : null},placeholder=${field == 'card' ? '0000 0000 0000 0000' : null}"/>
    <div class="invalid-feedback" th:if="${#fields.hasErrors(field)}" th:errors="*{__${field}__}"></div>
</div>

<div th:fragment="password(field, label, autocomplete, required)" class="mb-3">
    <label class="form-label" th:for="${field}"><span th:text="${label}"></span><span class="required-mark" th:if="${required}" aria-hidden="true"> *</span></label>
    <div class="input-group has-validation">
        <input class="form-control" type="password" th:id="${field}" th:name="${field}"
               th:autocomplete="${autocomplete}" th:classappend="${#fields.hasErrors(field)} ? 'is-invalid'"/>
        <button type="button" class="btn btn-outline-secondary" data-toggle-password
                th:attr="data-show=#{label.password.show},data-hide=#{label.password.hide}" th:text="#{label.password.show}"></button>
        <div class="invalid-feedback" th:if="${#fields.hasErrors(field)}" th:errors="*{__${field}__}"></div>
    </div>
</div>

<th th:fragment="sortable(field, label)">
    <a th:href="@{${path + '?sort=' + field + '&dir=' + (sort == field and dir == 'asc' ? 'desc' : 'asc') + '&size=' + size + filterQs}}"
       th:text="${label}"></a>
    <span th:if="${sort == field}" th:text="${dir == 'asc'} ? '▲' : '▼'"></span>
</th>

<nav th:fragment="pager" th:if="${page.totalPages > 1}">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{${path + '?page=' + (page.number - 1) + listQs}}">&laquo;</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, page.number - 3), T(java.lang.Math).min(page.totalPages - 1, page.number + 3))}"
            th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:href="@{${path + '?page=' + i + listQs}}" th:text="${i + 1}"></a>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{${path + '?page=' + (page.number + 1) + listQs}}">&raquo;</a>
        </li>
    </ul>
</nav>
</body>
</html>
