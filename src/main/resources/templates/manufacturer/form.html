<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{title.manufacturer.form})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 560px;">
    <h1 class="h3 mb-3" th:text="#{title.manufacturer.form}"></h1>
    <form th:action="@{${formAction}}" th:object="${manufacturer}" method="post" novalidate>
        <div th:replace="~{fragments/layout :: globalErrors}"></div>
        <div th:replace="~{fragments/layout :: textField('name', #{label.name}, 'text', true)}"></div>
        <button class="btn btn-primary" type="submit" th:text="#{btn.save}"></button>
        <a class="btn btn-link" th:href="@{/manufacturers}" th:text="#{btn.cancel}"></a>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
