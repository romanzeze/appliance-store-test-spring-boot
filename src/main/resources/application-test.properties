spring.datasource.url=jdbc:h2:mem:store;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.h2.console.enabled=true

spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/dev
spring.flyway.placeholders[adminPassword]=Test-Only-Admin-1!
spring.flyway.placeholders[adminEmail]=admin@example.com

app.jwt.secret=test-only-jwt-secret-key-0123456789-abcdef
